[package]
name = "spending-policy"
version = "0.2.0"
edition = "2021"
publish = false

[lib]
# rlib for host `cargo test` (Windows DLL ordinal limit with Soroban SDK 29).
# `stellar contract build` forces cdylib via rustc --crate-type=cdylib.
crate-type = ["rlib"]

[dependencies]
soroban-sdk = "29.0.1"

[dev-dependencies]
soroban-sdk = { version = "29.0.1", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
